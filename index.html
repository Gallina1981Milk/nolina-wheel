<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колело на Късмета</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:  #fff;
            color: #353333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
         /* Стилизиране на контейнера за логото */
       .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 0px; /* Намалено на 0, за да се вдигне максимално нагоре */
            margin-bottom: 10px; /* Намалено разстояние до текста под него */
        }

        .logo-container img {
          
            height: auto;
            object-fit: contain;
           
        }

        h1 {
            margin-bottom: 10px;
            color: #1a1919;
            text-align: center;
        }

        p {
            margin-bottom: 30px;
            font-size: 1.1rem;
            opacity: 0.9;
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin-bottom: 30px;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.3));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 8px solid #fff;
            background-color: #fff;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .spin-btn {
            background-color: #0086ca;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .spin-btn:hover {
            background-color: #4c60bb;
            transform: translateY(-2px);
        }

        .spin-btn:disabled {
            background-color: #a4b0be;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 80%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: #ff4757;
            margin-top: 0;
        }

        .close-btn {
            background-color: #1e3c72;
            color: white;
            border: none;
            padding: 10px 25px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
       <div class="logo-container">
        <!-- ЗАМЕНЕТЕ "logo." С ИМЕТО НА ВАШИЯ ФАЙЛ ИЛИ ЛИНК КЪМ ЛОГОТО -->
        <img src="logo.jpg" alt="Фирмено Лого">
    </div>

    <h1>Завърти колелото и Спечели!</h1>
    <p>Вземи своята награда на касата.</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel() color:#1e90ff">ЗАВЪРТИ</button>

    <!-- Модал за резултат -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>Честито! 🎉</h2>
            <p>Ти спечели:</p>
            <h3 id="prizeText" style="font-size: 1.8rem; color: #448af3; margin: 15px 0;">-</h3>
            <p style="font-size: 0.9rem; color: #666;">Покажи този екран на служител, за да вземеш наградата си.</p>
            <button class="close-btn" onclick="closeModal()">Затвори</button>
        </div>
    </div>

    <!-- Аудио елементи за звуци -->
    <audio id="spinSound" src="https://mixkit.co" preload="auto"></audio>
    <audio id="winSound" src="https://mixkit.co" preload="auto"></audio>

    <script> 
        const prizes = [
            { text: "-5% Отстъпка", color: "#ff4757" },
            { text: "Профил Modde", color: "#ffa502" },
            { text: "-10% Отстъпка", color: "#2ed573" },
            { text: "20% Отстъпка", color: "#1e90ff" },
            { text: "Опитай пак", color: "#747d8c" },
            { text: "-15% Отстъпка", color: "#9b59b6" }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const numSectors = prizes.length;
        const arcSize = (2 * Math.PI) / numSectors;
        
        // Вземане на аудио елементите
        const spinSound = document.getElementById("spinSound");
        const winSound = document.getElementById("winSound");

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const radius = canvas.width / 2;
            ctx.textBaseline = "middle";
            ctx.textAlign = "right";
            ctx.font = "bold 16px sans-serif";

            for (let i = 0; i < numSectors; i++) {
                const angle = i * arcSize;
                
                ctx.fillStyle = prizes[i].color;
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + arcSize);
                ctx.lineTo(radius, radius);
                ctx.fill();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);
                ctx.fillStyle = "#fff";
                ctx.fillText(prizes[i].text, radius - 20, 0);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (sessionStorage.getItem("wheelSpun")) {
                alert("Вече сте завъртели колелото днес!");
                return;
            }

            spinBtn.disabled = true;

            // Пускане на звука за въртене
            spinSound.currentTime = 0;
            spinSound.play().catch(error => console.log("Аудиото изисква първо взаимодействие с потребителя:", error));

            const extraDegrees = Math.floor(Math.random() * 360);
            const totalDegrees = 1800 + extraDegrees; 
            
            canvas.style.transform = `rotate(${totalDegrees}deg)`;

            setTimeout(() => {
                // Спиране на звука за въртене и пускане на звука за победа
                spinSound.pause();
                winSound.currentTime = 0;
                winSound.play();

                const normalizedAngle = (360 - (extraDegrees % 360) + 270) % 360;
                const sectorDegrees = 360 / numSectors;
                const winningIndex = Math.floor(normalizedAngle / sectorDegrees) % numSectors;
                
                const winningPrize = prizes[winningIndex].text;

                document.getElementById("prizeText").innerText = winningPrize;
                document.getElementById("resultModal").style.display = "flex";
                
                sessionStorage.setItem("wheelSpun", "true");
            }, 4000); // 4000ms съвпада с времето на въртене
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
        }

        drawWheel();
    </script>
</body>
</html>
